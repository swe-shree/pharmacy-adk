[project]
name = "pharmacy-adk"
version = "0.1.0"
description = "Google ADK pharmacy multi-agent"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=1.10.0",
  "google-genai>=1.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"